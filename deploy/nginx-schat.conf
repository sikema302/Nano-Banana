# ─── www.schat.top Nginx 配置 ───────────────────────────────────────────
# 所有请求透传到 Express 端口 3001，GET/POST/PUT/DELETE 全部允许。
# 修改后执行: nginx -t && nginx -s reload

upstream nano_banana_backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name schat.top www.schat.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name schat.top www.schat.top;

    ssl_certificate     /www/server/panel/vhost/cert/schat.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/schat.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 所有请求透传到 Express，不限制 HTTP 方法
    location / {
        proxy_pass http://nano_banana_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 60s;
        send_timeout          600s;
        proxy_buffering       off;
        proxy_cache           off;
        proxy_no_cache        1;
        proxy_cache_bypass    1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
}