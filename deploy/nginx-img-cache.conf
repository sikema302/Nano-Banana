# ─── pixory 图片直连缓存层 ─────────────────────────────────────────────
# 链路：用户 →(灰云直连香港源站)→ 本机 Nginx 磁盘缓存 →(未命中时回源)→ R2
#
# 前置条件（缺一不可，详见对话/部署说明）：
# 1. Cloudflare DNS 里 img.pixory.top 改为 A 记录 → 本机 IP，且关闭代理（灰云 DNS only）
# 2. R2 桶 pixory-temp-images 的 r2.dev 公开域名已启用（2026-10-21）：
#    https://pub-b12a4f8995494277b1d1b1ff7c6e29fd.r2.dev（见下方 $r2_origin）
# 3. 宝塔已为 img.pixory.top 申请 SSL 证书（路径见下方 ssl_certificate）。
# 4. 本机防火墙/安全组已放行 80/443 的公网直连（此前若只放行 Cloudflare 网段需放开）。

proxy_cache_path /www/wwwcache/pixory-img levels=1:2 keys_zone=pixory_img_cache:32m
    max_size=8g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name img.pixory.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name img.pixory.top;

    ssl_certificate     /www/server/panel/vhost/cert/img.pixory.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/img.pixory.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IMG_SSL:10m;
    ssl_session_timeout 10m;

    access_log off;

    set $r2_origin "pub-b12a4f8995494277b1d1b1ff7c6e29fd.r2.dev";
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    location / {
        proxy_pass https://$r2_origin;
        proxy_set_header Host $r2_origin;
        proxy_ssl_server_name on;
        proxy_ssl_name $r2_origin;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_cache pixory_img_cache;
        proxy_cache_key $uri;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 301 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Img-Cache $upstream_cache_status always;
    }
}
