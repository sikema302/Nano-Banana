name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      DEPLOY_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
      VISIONARY_NANO_LITE_API_KEY: ${{ secrets.VISIONARY_NANO_LITE_API_KEY }}
      FLUX_BANANA_API_KEY: ${{ secrets.FLUX_BANANA_API_KEY }}
      SCHAT_API_KEY: ${{ secrets.SCHAT_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: |
          npm run lint
          npm run test:server
          npm run build

      - name: Package release with secrets
        run: |
          mkdir -p .deploy-package
          git archive HEAD | tar -x -C .deploy-package
          cp -a dist .deploy-package/dist

          # 将密钥文件打包进 .secrets 目录
          mkdir -p .deploy-package/.secrets
          printf '%s' "$VISIONARY_NANO_LITE_API_KEY" > .deploy-package/.secrets/nano-lite-key
          printf '%s' "$FLUX_BANANA_API_KEY" > .deploy-package/.secrets/flux-banana-key
          printf '%s' "$SCHAT_API_KEY" > .deploy-package/.secrets/schat-key
          {
            printf 'R2_ACCOUNT_ID="%s"\n' "$R2_ACCOUNT_ID"
            printf 'R2_ACCESS_KEY_ID="%s"\n' "$R2_ACCESS_KEY_ID"
            printf 'R2_SECRET_ACCESS_KEY="%s"\n' "$R2_SECRET_ACCESS_KEY"
            printf 'R2_BUCKET_NAME="%s"\n' "$R2_BUCKET_NAME"
            printf 'R2_PUBLIC_BASE_URL="%s"\n' "$R2_PUBLIC_BASE_URL"
          } > .deploy-package/.secrets/r2-env

          tar -czf release.tar.gz -C .deploy-package .
          echo "Release package: $(du -sh release.tar.gz | cut -f1)"

      - name: Deploy via webhook
        run: |
          set -euo pipefail

          echo "Sending release to webhook..."
          http_code=$(curl -sS -o /tmp/webhook-response.json -w '%{http_code}' \
            --max-time 120 \
            -X POST \
            -H "X-Deploy-Secret: $DEPLOY_SECRET" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @release.tar.gz \
            "$WEBHOOK_URL" 2>&1) || {
            echo "Webhook request failed"
            exit 1
          }

          echo "Webhook response HTTP $http_code"
          cat /tmp/webhook-response.json

          if [ "$http_code" != "200" ]; then
            echo "Webhook returned non-200 status"
            exit 1
          fi

      - name: Poll deployment status
        run: |
          set -euo pipefail
          STATUS_URL="${WEBHOOK_URL%/api/deploy}/api/deploy/status"

          echo "Polling deployment status..."
          for attempt in $(seq 1 240); do
            status_json=$(curl -sS --max-time 10 -H "X-Deploy-Secret: $DEPLOY_SECRET" "$STATUS_URL" 2>/dev/null || true)
            if [ -z "$status_json" ]; then
              echo "Attempt $attempt: server not reachable (may be restarting)"
              sleep 5
              continue
            fi

            deploy_status=$(echo "$status_json" | node -e "let raw=''; process.stdin.on('data', chunk => raw += chunk); process.stdin.on('end', () => { try { console.log(JSON.parse(raw).status || 'unknown'); } catch { console.log('unknown'); } });")
            echo "Attempt $attempt: status=$deploy_status"

            if [ "$deploy_status" = "completed" ]; then
              exit_code=$(echo "$status_json" | node -e "let raw=''; process.stdin.on('data', chunk => raw += chunk); process.stdin.on('end', () => { try { console.log(JSON.parse(raw).exitCode || 1); } catch { console.log(1); } });")
              echo "Deployment completed with exit code: $exit_code"
              exit "$exit_code"
            fi

            sleep 5
          done

          echo "Deployment status polling timed out"
          exit 1

      - name: Verify public health
        run: |
          PUBLIC_URL="${WEBHOOK_URL%/api/deploy}/api/ready"
          echo "Verifying public health at $PUBLIC_URL"
          consecutive_ready=0
          for attempt in $(seq 1 15); do
            if curl -fsS --connect-timeout 5 --max-time 15 "$PUBLIC_URL"; then
              echo
              consecutive_ready=$((consecutive_ready + 1))
              if [ "$consecutive_ready" -ge 3 ]; then
                echo "Public health check passed"
                exit 0
              fi
            else
              consecutive_ready=0
            fi
            sleep 3
          done
          echo "Public health check failed"
          exit 1