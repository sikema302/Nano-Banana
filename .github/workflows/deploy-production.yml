name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_HOST: 154.9.24.91
      SSH_PORT: "2223"
      SERVER_USER: root
      PROJECT_PATH: /var/www/nano-banana
      APP_NAME: nano-banana
      SSHPASS: ${{ secrets.DEPLOY_SERVER_PASSWORD }}
      VISIONARY_NANO_LITE_API_KEY: ${{ secrets.VISIONARY_NANO_LITE_API_KEY }}
      FLUX_BANANA_API_KEY: ${{ secrets.FLUX_BANANA_API_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect runtime changes
        id: changes
        shell: bash
        run: |
          server_changed=false
          before_sha='${{ github.event.before }}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$before_sha" ] || [ "$before_sha" = '0000000000000000000000000000000000000000' ]; then
            server_changed=true
          else
            changed_files="$(git diff --name-only "$before_sha" "$GITHUB_SHA")"
            if printf '%s\n' "$changed_files" | grep -Eq '^(server/|api/|package(-lock)?\.json$|src/lib/model-pricing\.ts$)'; then
              server_changed=true
            fi
          fi
          echo "server_changed=$server_changed" >> "$GITHUB_OUTPUT"
          echo "Server restart required: $server_changed"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: |
          npm run lint
          npm run test:server
          npm run build

      - name: Package release
        run: |
          mkdir -p .deploy-package
          git archive HEAD | tar -x -C .deploy-package
          cp -a dist .deploy-package/dist
          tar -czf release.tar.gz -C .deploy-package .

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload release
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$SSH_PORT" \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p '$PROJECT_PATH'"
          sshpass -e scp -P "$SSH_PORT" -o StrictHostKeyChecking=no \
            release.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/$APP_NAME-release.tar.gz"
          printf '%s' "$VISIONARY_NANO_LITE_API_KEY" | \
            sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
              "$SERVER_USER@$SERVER_HOST" "umask 077; cat > '/tmp/$APP_NAME-nano-lite-key'"
          printf '%s' "$FLUX_BANANA_API_KEY" | \
            sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
              "$SERVER_USER@$SERVER_HOST" "umask 077; cat > '/tmp/$APP_NAME-flux-banana-key'"

      - name: Capture sanitized production diagnostics
        run: |
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" "PROJECT_PATH='$PROJECT_PATH' APP_NAME='$APP_NAME' bash -s" <<'REMOTE'
          set +e
          cd "$PROJECT_PATH"
          echo '=== resources ==='
          uptime
          free -m
          swapon --show --noheadings --bytes | awk '{print "swap_bytes=" $3 " used_bytes=" $4}'
          echo '=== pm2 ==='
          pm2 jlist | node -e "let raw=''; process.stdin.on('data', chunk => raw += chunk); process.stdin.on('end', () => { for (const item of JSON.parse(raw).filter(entry => entry.name === process.env.APP_NAME)) { const env=item.pm2_env || {}; console.log(JSON.stringify({name:item.name,pid:item.pid,status:env.status,restarts:env.restart_time,unstableRestarts:env.unstable_restarts,exitCode:env.exit_code,uptime:env.pm_uptime,memory:item.monit?.memory,cpu:item.monit?.cpu})); } });"
          error_log="/root/.pm2/logs/$APP_NAME-error.log"
          for diagnostic in \
            'schema_init:Supabase schema initialization failed' \
            'user_query:Query user failed' \
            'out_of_memory:ENOMEM|heap out of memory' \
            'forced_exit:SIGKILL|exited with code'; do
            category="${diagnostic%%:*}"
            pattern="${diagnostic#*:}"
            count="$(tail -n 2000 "$error_log" 2>/dev/null | grep -Ec "$pattern" || true)"
            echo "$category=$count"
          done
          echo '=== supabase routes ==='
          supabase_host="$(node -e "const fs=require('fs'); const line=fs.readFileSync('.env.local','utf8').split(/\\r?\\n/).find(item=>item.startsWith('SUPABASE_URL=')); if(line) console.log(new URL(line.slice(line.indexOf('=')+1).replace(/^['\\\"]|['\\\"]$/g,'')).hostname)")"
          route_number=0
          while read -r supabase_ip; do
            [ -n "$supabase_ip" ] || continue
            route_number=$((route_number + 1))
            curl --connect-timeout 5 --max-time 12 --resolve "$supabase_host:443:$supabase_ip" \
              -s -o /dev/null -w "route=$route_number http=%{http_code} connect=%{time_connect}s total=%{time_total}s\n" \
              "https://$supabase_host/rest/v1/" || echo "route=$route_number result=unreachable"
          done < <(getent ahostsv4 "$supabase_host" | awk '{print $1}' | sort -u)
          curl --connect-timeout 2 --max-time 5 -sS -o /dev/null \
            -w 'local_health=%{http_code} total=%{time_total}s\n' http://127.0.0.1:3001/api/health || true
          REMOTE

      - name: Back up and deploy
        run: |
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" "SERVER_CHANGED='${{ steps.changes.outputs.server_changed }}' bash -s" <<'REMOTE'
          set -euo pipefail
          project='/var/www/nano-banana'
          backups="$project/.deploy-backups"
          timestamp="$(date +%Y%m%d-%H%M%S)"
          nano_lite_key_file='/tmp/nano-banana-nano-lite-key'
          flux_banana_key_file='/tmp/nano-banana-flux-banana-key'
          ssh_ports='/etc/ssh/sshd_config.d/99-port.conf'
          if ! grep -qx 'Port 2223' "$ssh_ports" 2>/dev/null; then
            printf 'Port 2222\nPort 2223\n' > "$ssh_ports"
            sshd -t
            systemctl reload ssh
          fi
          mkdir -p "$backups"
          tar -czf "$backups/$timestamp-pre-deploy.tar.gz" \
            --exclude='./node_modules' \
            --exclude='./.git' \
            --exclude='./.runtime' \
            --exclude='./.deploy-backups' \
            --exclude='./uploads' \
            --exclude='./.uploads' \
            -C "$project" .
          ls -1t "$backups"/*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm -f
          cd "$project"
          rm -rf dist server src scripts supabase api .github
          tar -xzf /tmp/nano-banana-release.tar.gz -C "$project"
          rm -f /tmp/nano-banana-release.tar.gz

          if [ -s "$nano_lite_key_file" ]; then
            nano_lite_key="$(cat "$nano_lite_key_file")"
            touch .env.local
            (grep -v '^VISIONARY_NANO_LITE_API_KEY=' .env.local || true) > .env.local.next
            printf 'VISIONARY_NANO_LITE_API_KEY="%s"\n' "$nano_lite_key" >> .env.local.next
            mv .env.local.next .env.local
            chmod 600 .env.local
          fi
          rm -f "$nano_lite_key_file"

          if [ -s "$flux_banana_key_file" ]; then
            flux_banana_key="$(cat "$flux_banana_key_file")"
            touch .env.local
            (grep -v '^FLUX_BANANA_API_KEY=' .env.local || true) > .env.local.next
            printf 'FLUX_BANANA_API_KEY="%s"\n' "$flux_banana_key" >> .env.local.next
            mv .env.local.next .env.local
            chmod 600 .env.local
          fi
          rm -f "$flux_banana_key_file"

          # Keep the 2 GB production host from OOM-killing Node during image bursts.
          if ! swapon --show | grep -q '/swapfile'; then
            if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile
              chmod 600 /swapfile
              mkswap /swapfile
            fi
            swapon /swapfile
          fi
          grep -q '^/swapfile none swap' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
          touch .env.local
          sed -i '/^PUBLIC_ASYNC_CONCURRENCY=/d' .env.local
          printf 'PUBLIC_ASYNC_CONCURRENCY="2"\n' >> .env.local
          chmod 600 .env.local

          dependency_stamp='node_modules/.pixory-package-lock.sha256'
          current_lock_hash="$(sha256sum package-lock.json | awk '{print $1}')"
          installed_lock_hash="$(cat "$dependency_stamp" 2>/dev/null || true)"
          dependencies_changed=false
          if [ ! -x node_modules/.bin/tsx ] || [ "$current_lock_hash" != "$installed_lock_hash" ]; then
            npm ci
            printf '%s' "$current_lock_hash" > "$dependency_stamp"
            dependencies_changed=true
          else
            echo 'Dependencies unchanged; skipping npm ci.'
          fi

          if ! pm2 describe nano-banana >/dev/null 2>&1; then
            pm2 start server/index.ts --name nano-banana --interpreter ./node_modules/.bin/tsx --exec-mode cluster -i 1 --wait-ready --listen-timeout 60000
          else
            # One cluster instance keeps background schedulers singleton while
            # PM2 reload still starts the replacement before stopping the old one.
            pm2_instance_count="$(pm2 jlist | node -e "let raw=''; process.stdin.on('data', chunk => raw += chunk); process.stdin.on('end', () => console.log(JSON.parse(raw).filter(item => item.name === 'nano-banana').length));")"
            if [ "$pm2_instance_count" -gt 1 ]; then
              pm2 scale nano-banana 1
            fi
            # Always reload after replacing the release files. This also
            # recovers cleanly when a previous deploy unpacked files but failed
            # before PM2 could activate them.
            pm2 reload nano-banana --update-env --wait-ready --listen-timeout 60000
          fi
          pm2 save >/dev/null
          # Startup includes database initialization and retention checks; allow
          # up to four minutes before treating a healthy PM2 restart as failed.
          consecutive_ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3001/api/ready; then
              echo
              consecutive_ready=$((consecutive_ready + 1))
              if [ "$consecutive_ready" -ge 3 ]; then
                echo "Deploy finished. Backup: $backups/$timestamp-pre-deploy.tar.gz"
                exit 0
              fi
            else
              consecutive_ready=0
            fi
            sleep 2
          done
          pm2 logs nano-banana --lines 80 --nostream
          exit 1
          REMOTE

      - name: Verify public health
        run: |
          consecutive_ready=0
          for attempt in $(seq 1 15); do
            if curl -fsS --connect-timeout 5 --max-time 15 https://pixory.top/api/ready; then
              echo
              consecutive_ready=$((consecutive_ready + 1))
              if [ "$consecutive_ready" -ge 3 ]; then
                exit 0
              fi
            else
              consecutive_ready=0
            fi
            sleep 3
          done
          exit 1
