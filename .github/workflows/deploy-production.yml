name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      DEPLOY_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
      VISIONARY_NANO_LITE_API_KEY: ${{ secrets.VISIONARY_NANO_LITE_API_KEY }}
      FLUX_BANANA_API_KEY: ${{ secrets.FLUX_BANANA_API_KEY }}
      SCHAT_API_KEY: ${{ secrets.SCHAT_API_KEY }}
      USSELG_STANDARD_KEY: ${{ secrets.USSELG_STANDARD_KEY }}
      USSELG_HD_KEY: ${{ secrets.USSELG_HD_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      DEPLOY_SERVER_PASSWORD: ${{ secrets.DEPLOY_SERVER_PASSWORD }}
      SERVER_HOST: 23.141.172.73
      SERVER_USER: root
      SSH_PORT: "22"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: |
          npm run lint
          npm run test:server
          npm run build

      - name: Package release with secrets
        run: |
          mkdir -p .deploy-package
          git archive HEAD | tar -x -C .deploy-package
          cp -a dist .deploy-package/dist

          # 将密钥文件打包进 .secrets 目录
          mkdir -p .deploy-package/.secrets
          printf '%s' "$VISIONARY_NANO_LITE_API_KEY" > .deploy-package/.secrets/nano-lite-key
          printf '%s' "$FLUX_BANANA_API_KEY" > .deploy-package/.secrets/flux-banana-key
          printf '%s' "$SCHAT_API_KEY" > .deploy-package/.secrets/schat-key
          printf '%s' "$DEPLOY_SECRET" > .deploy-package/.secrets/deploy-secret
          {
            printf 'R2_ACCOUNT_ID="%s"\n' "$R2_ACCOUNT_ID"
            printf 'R2_ACCESS_KEY_ID="%s"\n' "$R2_ACCESS_KEY_ID"
            printf 'R2_SECRET_ACCESS_KEY="%s"\n' "$R2_SECRET_ACCESS_KEY"
            printf 'R2_BUCKET_NAME="%s"\n' "$R2_BUCKET_NAME"
            printf 'R2_PUBLIC_BASE_URL="%s"\n' "$R2_PUBLIC_BASE_URL"
          } > .deploy-package/.secrets/r2-env

          {
            if [ -n "$USSELG_STANDARD_KEY" ]; then printf 'USSELG_STANDARD_KEY="%s"\n' "$USSELG_STANDARD_KEY"; fi
            if [ -n "$USSELG_HD_KEY" ]; then printf 'USSELG_HD_KEY="%s"\n' "$USSELG_HD_KEY"; fi
          } > .deploy-package/.secrets/uselg-env

          tar -czf release.tar.gz -C .deploy-package .
          echo "Release package: $(du -sh release.tar.gz | cut -f1)"

      - name: Install deployment transport
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy to server (SSH direct)
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SERVER_PASSWORD" || { echo "DEPLOY_SERVER_PASSWORD is missing"; exit 1; }
          export SSHPASS="$DEPLOY_SERVER_PASSWORD"
          remote_archive="/tmp/nano-banana-release-${GITHUB_SHA}.tar.gz"
          expected_status="/tmp/nano-banana-deploy.status"

          echo "Transferring release archive via scp..."
          sshpass -e scp -P "$SSH_PORT" \
            -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            release.tar.gz "$SERVER_USER@$SERVER_HOST:$remote_archive"

          echo "Running deploy.sh directly on server (no cron dependency)..."
          sshpass -e ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "rm -f '$expected_status' /tmp/nano-banana-deploy.sh; tar -xzf '$remote_archive' -O ./deploy.sh > /tmp/nano-banana-deploy.sh; chmod 700 /tmp/nano-banana-deploy.sh; test -s /tmp/nano-banana-deploy.sh || { echo 'ERROR: deploy.sh extraction produced empty file'; exit 1; }; bash /tmp/nano-banana-deploy.sh '$remote_archive'"

          echo "=== deploy.sh exit code: $? ==="

      - name: Verify upload-release endpoint live
        run: |
          set -euo pipefail
          # 部署成功后，新代码里的 POST /api/upload-release 端点必须存在。
          # 无密钥请求会返回 401（路由存在），404 说明仍是旧代码。
          endpoint_found=0
          for attempt in $(seq 1 20); do
            http_code=$(curl -sS -o /tmp/up-response.txt -w '%{http_code}' \
              --connect-timeout 5 --max-time 20 \
              -X POST -H "Content-Type: application/octet-stream" \
              --data-binary @/dev/null \
              "https://pixory.top/api/upload-release" 2>/dev/null || true)
            echo "Attempt $attempt: upload-release HTTP $http_code"
            if [ "$http_code" = "401" ] || [ "$http_code" = "200" ] || [ "$http_code" = "403" ]; then
              echo "upload-release endpoint is live. Deployment of new code confirmed."
              endpoint_found=1
              break
            fi
            sleep 5
          done
          if [ "$endpoint_found" -ne 1 ]; then
            echo "ERROR: upload-release endpoint still not present after deployment. Server still running old code."
            exit 1
          fi

      - name: Verify public health
        run: |
          PUBLIC_URL="https://pixory.top/api/ready"
          echo "Verifying public health at $PUBLIC_URL"
          consecutive_ready=0
          for attempt in $(seq 1 15); do
            if curl -fsS --connect-timeout 5 --max-time 15 "$PUBLIC_URL"; then
              echo
              consecutive_ready=$((consecutive_ready + 1))
              if [ "$consecutive_ready" -ge 3 ]; then
                echo "Public health check passed"
                exit 0
              fi
            else
              consecutive_ready=0
            fi
            sleep 3
          done
          echo "Public health check failed"
          exit 1
