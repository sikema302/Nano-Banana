name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      DEPLOY_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
      VISIONARY_NANO_LITE_API_KEY: ${{ secrets.VISIONARY_NANO_LITE_API_KEY }}
      FLUX_BANANA_API_KEY: ${{ secrets.FLUX_BANANA_API_KEY }}
      SCHAT_API_KEY: ${{ secrets.SCHAT_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      DEPLOY_SERVER_PASSWORD: ${{ secrets.DEPLOY_SERVER_PASSWORD }}
      SERVER_HOST: 64.90.1.229
      SERVER_USER: root
      SSH_PORT: "22"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: |
          npm run lint
          npm run test:server
          npm run build

      - name: Package release with secrets
        run: |
          mkdir -p .deploy-package
          git archive HEAD | tar -x -C .deploy-package
          cp -a dist .deploy-package/dist

          # 将密钥文件打包进 .secrets 目录
          mkdir -p .deploy-package/.secrets
          printf '%s' "$VISIONARY_NANO_LITE_API_KEY" > .deploy-package/.secrets/nano-lite-key
          printf '%s' "$FLUX_BANANA_API_KEY" > .deploy-package/.secrets/flux-banana-key
          printf '%s' "$SCHAT_API_KEY" > .deploy-package/.secrets/schat-key
          printf '%s' "$DEPLOY_SECRET" > .deploy-package/.secrets/deploy-secret
          {
            printf 'R2_ACCOUNT_ID="%s"\n' "$R2_ACCOUNT_ID"
            printf 'R2_ACCESS_KEY_ID="%s"\n' "$R2_ACCESS_KEY_ID"
            printf 'R2_SECRET_ACCESS_KEY="%s"\n' "$R2_SECRET_ACCESS_KEY"
            printf 'R2_BUCKET_NAME="%s"\n' "$R2_BUCKET_NAME"
            printf 'R2_PUBLIC_BASE_URL="%s"\n' "$R2_PUBLIC_BASE_URL"
          } > .deploy-package/.secrets/r2-env

          tar -czf release.tar.gz -C .deploy-package .
          echo "Release package: $(du -sh release.tar.gz | cut -f1)"

      - name: Install deployment transport
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy with automatic fallback
        run: |
          set -euo pipefail

          WEBHOOK_URL="https://pixory.top/api/deploy"
          DEPLOY_KEY="${DEPLOY_SECRET:-temp-deploy-2026}"
          echo "Trying fast webhook deployment..."

          http_code=$(curl -sS -o /tmp/webhook-response.json -w '%{http_code}' \
            --connect-timeout 10 --max-time 45 \
            -X POST \
            -H "X-Deploy-Secret: $DEPLOY_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @release.tar.gz \
            "$WEBHOOK_URL" 2>/dev/null || printf '000')

          if [ "$http_code" = "200" ]; then
            echo "Webhook accepted release"
            echo "DEPLOY_METHOD=webhook" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Webhook unavailable (HTTP $http_code), switching to SSH fallback..."
          test -n "$DEPLOY_SERVER_PASSWORD" || { echo "DEPLOY_SERVER_PASSWORD is missing"; exit 1; }
          export SSHPASS="$DEPLOY_SERVER_PASSWORD"
          remote_archive="/tmp/nano-banana-release-${GITHUB_SHA}.tar.gz"

          sshpass -e scp -P "$SSH_PORT" \
            -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            release.tar.gz "$SERVER_USER@$SERVER_HOST:$remote_archive"

          sshpass -e ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            "rm -f /tmp/nano-banana-deploy.sh; tar -xzf '$remote_archive' -O deploy.sh > /tmp/nano-banana-deploy.sh; chmod 700 /tmp/nano-banana-deploy.sh; DEPLOY_STATUS_FILE=/tmp/nano-banana-deploy.status DEPLOY_LOG_FILE=/tmp/nano-banana-deploy.log bash /tmp/nano-banana-deploy.sh '$remote_archive'"

          echo "DEPLOY_METHOD=ssh" >> "$GITHUB_ENV"

      - name: Poll deployment status
        if: env.DEPLOY_METHOD == 'webhook'
        run: |
          set -euo pipefail
          STATUS_URL="https://pixory.top/api/deploy/status"

          echo "Polling deployment status..."
          for attempt in $(seq 1 240); do
            status_json=$(curl -sS --max-time 10 -H "X-Deploy-Secret: $DEPLOY_SECRET" "$STATUS_URL" 2>/dev/null || true)
            if [ -z "$status_json" ]; then
              echo "Attempt $attempt: server not reachable (may be restarting)"
              sleep 5
              continue
            fi

            deploy_status=$(echo "$status_json" | node -e "let raw=''; process.stdin.on('data', chunk => raw += chunk); process.stdin.on('end', () => { try { console.log(JSON.parse(raw).status || 'unknown'); } catch { console.log('unknown'); } });")
            echo "Attempt $attempt: status=$deploy_status"

            if [ "$deploy_status" = "completed" ]; then
              exit_code=$(echo "$status_json" | node -e "let raw=''; process.stdin.on('data', chunk => raw += chunk); process.stdin.on('end', () => { try { console.log(JSON.parse(raw).exitCode ?? 1); } catch { console.log(1); } });")
              echo "Deployment completed with exit code: $exit_code"
              exit "$exit_code"
            fi

            if [ "$deploy_status" = "failed" ]; then
              echo "Deployment failed; server diagnostics:"
              echo "$status_json"
              exit 1
            fi

            sleep 5
          done

          echo "Deployment status polling timed out"
          exit 1

      - name: Verify public health
        run: |
          PUBLIC_URL="https://pixory.top/api/ready"
          echo "Verifying public health at $PUBLIC_URL"
          consecutive_ready=0
          for attempt in $(seq 1 15); do
            if curl -fsS --connect-timeout 5 --max-time 15 "$PUBLIC_URL"; then
              echo
              consecutive_ready=$((consecutive_ready + 1))
              if [ "$consecutive_ready" -ge 3 ]; then
                echo "Public health check passed"
                exit 0
              fi
            else
              consecutive_ready=0
            fi
            sleep 3
          done
          echo "Public health check failed"
          exit 1