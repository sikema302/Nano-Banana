name: Diagnose SSH

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSHPASS: ${{ secrets.DEPLOY_SERVER_PASSWORD }}

    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Inspect server SSH path
        run: |
          sshpass -e ssh -p 2223 -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            root@154.9.24.91 'bash -s' <<'REMOTE'
          set -u
          echo '== service =='
          systemctl is-active ssh || true
          ss -lntp | grep -E ':(22|2222|2223)[[:space:]]' || true
          echo '== effective sshd limits =='
          sshd -T | grep -E '^(port|maxstartups|maxsessions|logingracetime|passwordauthentication|permitrootlogin)' || true
          echo '== fail2ban =='
          if command -v fail2ban-client >/dev/null 2>&1; then
            fail2ban-client status || true
            fail2ban-client status sshd || true
          else
            echo 'not installed'
          fi
          echo '== source-specific firewall rules =='
          iptables-save 2>/dev/null | grep -E '45\.192\.201\.21|dport (22|2222|2223)' || true
          nft list ruleset 2>/dev/null | grep -E -C 2 '45\.192\.201\.21|dport (22|2222|2223)' || true
          echo '== recent ssh events =='
          journalctl -u ssh --since '8 hours ago' --no-pager 2>/dev/null \
            | grep -E '45\.192\.201\.21|MaxStartups|drop connection|beginning MaxStartups|Connection from' \
            | tail -n 120 || true
          echo '== recent kernel firewall events =='
          journalctl -k --since '8 hours ago' --no-pager 2>/dev/null \
            | grep -E '45\.192\.201\.21|DROP|REJECT' \
            | tail -n 80 || true
          REMOTE

      - name: Capture local-source SSH packets
        run: |
          sshpass -e ssh -p 2223 -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            root@154.9.24.91 \
            "if command -v tcpdump >/dev/null 2>&1; then timeout 35 tcpdump -nn -i any 'host 45.192.201.21 and tcp port 2223' -c 20; else echo TCPDUMP_NOT_INSTALLED; fi" \
            || true
