<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pixory Studio - upload references, craft prompts, generate and organize images." />
    <title>PIXORY</title>
    <script>
      // 在样式与 React 渲染之前先落定主题，避免深色用户看到浅色首屏闪烁
      (function () {
        try {
          var saved = localStorage.getItem('pixory-theme-v2');
          document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
